# Study tabs and their categories. Notes live in _study/ and join by `tab` + `category`.
tabs:
  - id: "trustworthy-ai"
    title: "Trustworthy AI"
    description: "Foundations, methods, and evaluation for trustworthy medical AI."
    question: "How do I evaluate whether a model deserves trust?"
  - id: "clinical-medicine"
    title: "Clinical Medicine"
    description: "Clinical foundations for translating AI into healthcare."
    question: "What clinical knowledge is needed to make that evaluation meaningful?"
categories:
  - id: "foundations"
    tab: "trustworthy-ai"
    title: "Mathematical & Statistical Foundations"
    note: "The part that does not expire. Whatever writes the code, these are the tools I use to decide what an experiment established."
  - id: "causality"
    tab: "trustworthy-ai"
    title: "Causality, Bias & Shortcuts"
    note: "Why a model predicts what it predicts, and which of those reasons survive a change of setting."
  - id: "alignment"
    tab: "trustworthy-ai"
    title: "Clinical Alignment & Interpretability"
    note: "Whether what a model exposes about its reasoning means anything clinically, and whether it reflects the computation at all."
  - id: "auditing"
    tab: "trustworthy-ai"
    title: "Evidence Auditing"
    note: "Methods for interrogating a trained model's evidence, without retraining it and without faithfulness annotations."
  - id: "evaluation"
    tab: "trustworthy-ai"
    title: "Evaluation, Generalization & Reliability"
    note: "What an evaluation establishes, and whether the result survives another site, another scanner, and another year."
  - id: "systems"
    tab: "trustworthy-ai"
    title: "Medical AI Systems & Deployment"
    note: "The moving frontier, and what happens to a model after it leaves the paper."
  - id: "hepatobiliary"
    tab: "clinical-medicine"
    title: "Hepatobiliary Medicine & Imaging"
    note: "The organ system my research works on, studied as medicine first and as a modeling problem second."
  - id: "neurology"
    tab: "clinical-medicine"
    title: "Neurology"
    note: "Time-critical and slow-onset neurological disease, and what each demands of a diagnostic system."
  - id: "oncology"
    tab: "clinical-medicine"
    title: "Oncology"
    note: "Screening, staging, and detection, where the meaning of a positive result depends on the population it came from."
  - id: "cardiovascular"
    tab: "clinical-medicine"
    title: "Cardiovascular Medicine"
    note: "Long-horizon risk prediction, where calibration matters more than discrimination."
  - id: "rheum-immunology"
    tab: "clinical-medicine"
    title: "Rheumatology & Clinical Immunology"
    note: "Diagnosis assembled from criteria rather than settled by a single test."
  - id: "dermatology"
    tab: "clinical-medicine"
    title: "Dermatology"
    note: "The most heavily studied setting for medical image AI, and its most instructive failures."
  - id: "sleep-circadian"
    tab: "clinical-medicine"
    title: "Sleep & Circadian Medicine"
    note: "Continuous physiological signal rather than a single image."
  - id: "critical-care"
    tab: "clinical-medicine"
    title: "Critical Care Medicine"
    note: "Dense monitoring, rapid decisions, and prediction whose output shapes goals of care."
  - id: "translational"
    tab: "clinical-medicine"
    title: "Translational Medicine"
    note: "The crossing itself, as a subject in its own right."

# Extra surface forms for concept detection in bin/build_knowledge_graph.py.
#
# A concept is linked to a piece of writing when its label, or any alias below,
# appears in the text. Labels that read as natural prose ("Shortcut learning",
# "Calibration") need nothing here. Labels that are ontology coinages
# ("Feedback sensitivity identity") never appear verbatim and would otherwise
# never link, so they get the phrases actually used in the writing.
#
# Keep aliases specific. A short or common alias produces false links, which are
# worse than a missing one: the graph's whole claim is that an edge means the
# writing really does discuss the concept.
Feedback sensitivity identity: ["sensitivity function", "complementary sensitivity", "S + T = 1"]
Bias-variance decomposition: ["bias-variance", "bias–variance"]
Bayes error bound: ["Bayes error", "irreducible error"]
Sampling theorem: ["Nyquist", "aliasing*", "anti-aliasing", "sampling theorem"]
Data processing inequality: ["data processing inequality", "mutual information"]

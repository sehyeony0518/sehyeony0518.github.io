assertions:
  - [E01, Auditing, assessesProperty, Faithfulness, M, high, "A frozen-model explanation audit compares the readout's stated importance against the behaviour it purports to explain.", null]
  - [E02, Intervention & ablation, assessesProperty, Faithfulness, M, high, "Controlled perturbations compare attribution-predicted effects with actual score changes, conditional on the perturbation design.", "arXiv:1901.09392"]
  - [E03, Evaluation metrics, assessesProperty, Calibration, D, high, "Calibration measures quantify the discrepancy between predicted probabilities and observed frequencies in a specified population.", "arXiv:1706.04599"]
  - [E04, Evaluation metrics, assessesProperty, Faithfulness, D, high, "Scope: explanation-specific metrics, which quantify agreement between attributed importance and responses under a defined perturbation distribution.", "arXiv:1901.09392"]
  - [E05, Auditing, assessesProperty, Plausibility, M, high, "Blinded clinical review can assess whether an explanation looks reasonable for the task, separately from computational testing.", null]
  - [E06, Subgroup & fairness, assessesProperty, Calibration, M, high, "Calibration can be assessed within prespecified patient or acquisition groups; this does not establish fairness under every criterion.", null]
  - [E07, Auditing, assessesProperty, Calibration, M, high, "An audit can compare frozen-model probabilities with independently obtained outcomes on a declared evaluation population.", null]
  - [E08, Auditing, probesThreat, Shortcut learning, M, high, "Shortcut hypotheses are explicit audit targets requiring task-specific investigation, not aggregate accuracy.", "10.1016/S2589-7500(22)00003-6"]
  - [E09, Intervention & ablation, probesThreat, Shortcut learning, E, high, "Controlled changes to suspected non-diagnostic cues reveal predictor sensitivity; shown on COVID-19 radiograph classifiers, not gallbladder models.", "10.1038/s42256-021-00338-7"]
  - [E10, Counterfactual, probesThreat, Shortcut learning, E, medium, "Generative comparisons can expose candidate cues, but coupled edits prevent treating each comparison as an isolated intervention.", "10.1038/s42256-021-00338-7"]
  - [E11, Causal inference, probesThreat, Confounding, D, high, "An explicit causal model identifies candidate confounding paths relative to an estimand; it does not discover unmeasured confounders.", "10.1214/09-SS057"]
  - [E12, Causal inference, probesThreat, Spurious correlation, M, high, "Causal analysis separates an observed association from the intervention claim it might be taken to support.", "10.1214/09-SS057"]
  - [E13, Subgroup & fairness, probesThreat, Shortcut learning, M, medium, "Stratifying by suspected cue availability can reveal shortcut-compatible failures; severity and case-mix remain alternative explanations.", null]
  - [E14, Attribution & saliency, probesThreat, Shortcut learning, E, medium, "Attributions nominate suspicious regions for controlled testing; they do not independently establish reliance.", "10.1038/s42256-021-00338-7"]
  - [E15, Confounding, canIntroduce, Spurious correlation, D, high, "A common-cause pathway produces association that does not represent the causal effect being estimated.", "10.1214/09-SS057"]
  - [E16, Spurious correlation, canIntroduce, Shortcut learning, E, high, "An association available in training can support a rule that fails when it changes; learning that rule is not inevitable.", "arXiv:2004.07780"]
  - [E17, Representation learning, canIntroduce, Shortcut learning, E, high, "Learned representations can privilege easy predictive cues over the evidence the task intends.", "arXiv:2004.07780"]
  - [E18, Ultrasound acquisition, canIntroduce, Spurious correlation, E, high, "Acquisition and documentation workflows can couple annotations with the target imaged; demonstrated on fetal-ultrasound calipers.", "10.1007/978-3-031-72111-3_59"]
  - [E19, Intervention & ablation, canIntroduce, Distribution shift, E, high, "Removing or replacing regions at test time creates inputs unlike training data; ROAR answers this by retraining, which changes the question.", "arXiv:1806.10758"]
  - [E20, Screening programs, canIntroduce, Distribution shift, M, high, "Moving a model from referred symptomatic patients into screening changes eligibility, prevalence and disease spectrum.", null]

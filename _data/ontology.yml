  - [E93, Intervention & ablation, assessesProperty, Translation invariance, M, high, "Shifting the input and measuring the output is a direct test of invariance against equivariance. Classification and localisation can be served by separate heads, one invariant and one equivariant, so the two requirements need not conflict.", "arXiv:1605.06409"]

  - [E97, Attention mechanism, doesNotEstablish, Faithfulness, D, high, "An attention weight reports how much a value vector was routed into an update; by the second layer that vector already summarises much of the sequence, so the weight is a routing diagram and not an attribution.", "arXiv:1706.03762"]
  - [E98, Ensembling, doesNotEstablish, Calibration, D, high, "Spread across independently initialised models supplies a predictive distribution where a point estimate supplies only a score, but the spread is a property of the ensemble, not a comparison with observed outcomes. Calibration assessment requires that comparison.", "arXiv:1612.01474"]
  - [E99, Ensembling, probesThreat, Distribution shift, M, medium, "Members that converged to different modes tend to agree where the data constrained the function and diverge where they did not. The signal is informative but neither guaranteed nor specific to distribution shift.", "arXiv:2002.08791"]
  - [E100, Shortcut learning, warrantsReassessmentOf, Ensembling, M, high, "Members sharing an architecture, a training set and a preprocessing pipeline share the biases those impose, so a shortcut present in the data can leave them agreeing confidently and wrong together. Agreement is therefore weak evidence of correctness under a shared shortcut.", null]
  - [E101, Pseudo-labelling, canIntroduce, Label noise, M, high, "A teacher's outputs become the student's training targets, so the teacher's errors are inherited by construction rather than averaged away.", "10.1109/CVPR42600.2020.01070"]
  - [E102, Pseudo-labelling, canIntroduce, Spurious correlation, M, medium, "Systematic teacher error can propagate or amplify: a subgroup the teacher under-detects can train the student to under-detect it further. Random error does not generally cancel back to the true targets, and amplification is not inevitable either.", "10.1109/CVPR46437.2021.01139"]
  - [E103, Label noise, warrantsReassessmentOf, Auditing, D, high, "When the reference standard is itself several points from correct, disagreement between model and standard no longer separates model error from annotation error.", "arXiv:2006.07159"]
  - [E104, Label noise, warrantsReassessmentOf, Calibration, D, high, "Probabilities fitted to agree with noisy labels are calibrated to the annotation process, and the agreement is evidence about that process rather than about the condition.", "arXiv:2006.07159"]
  - [E105, Auditing, canAudit, Pseudo-labelling, M, high, "The labelling model is an inspection target in its own right, and one that evaluating the final model against those same labels cannot reach.", null]
  - [E106, Implicit representation, changesObservabilityOf, Sonographic features, M, medium, "A field queried between its training views renders interpolated structure with the same appearance as measured structure, and the output carries no marker separating them.", "10.1007/978-3-030-58452-8_24"]
  - [E107, Sensitivity analysis, assessesProperty, Stability margin, M, high, "Sweeping a parameter and locating where behaviour changes qualitatively measures how far the current operating point sits from that boundary.", null]
  - [E108, Evaluation metrics, doesNotEstablish, Stability margin, D, high, "A point estimate on a fixed test set reports current performance; it says nothing about how far inputs or thresholds can move before that performance fails.", null]
  - [E109, Operating point selection, doesNotEstablish, Stability margin, D, high, "Choosing a threshold fixes an operating point without quantifying how much the score distribution may shift before the choice stops holding.", null]
  - [E110, Deployment feedback loop, warrantsReassessmentOf, Stability margin, M, medium, "A path from a model's outputs back into its own training data is a feedback path, so a margin measured on the open pipeline need not bound the deployed one. The control reading holds only where the dynamics, delays and update rule are made explicit; a learning loop does not automatically possess a defined gain margin.", null]
  - [E111, Feedback correction, probesThreat, Distribution shift, M, high, "Measuring realised outcomes and correcting against them surfaces divergence between deployment and development conditions that an open pipeline never observes.", null]
  - [E112, Feedback correction, canIntroduce, Deployment feedback loop, D, high, "Correcting on a system's own measured output is by construction a closed loop. Whether it converges or diverges depends on the gain around it, but naming that gain requires an explicit model of the update rule and its delays.", null]
  - [E113, Identifiability criterion, limitsClaim, Causal inference, D, high, "If two causal models satisfy the stated assumptions and generate the same observational distribution but disagree on the target effect, that effect is not identified; more observations from that same distribution cannot resolve the disagreement.", null]
  - [E114, Identifiability analysis, assessesProperty, Causal identifiability, M, high, "An identification argument specifies the causal target and checks which assumptions connect it to observations; exchangeability, consistency and positivity are one route for treatment effects, not assumptions verified by predictive accuracy.", null]
  - [E115, Causal identifiability, doesNotEstablish, Clinical utility, D, high, "Identifying a treatment effect does not establish that a learned decision rule improves care: the policy, patient population, competing consequences and implementation still need assessment.", null]
  - [E116, Identifiability criterion, limitsClaim, Counterfactual, D, high, "An identified interventional distribution need not identify an individual counterfactual. Changing pixels tests a computational input intervention; interpreting the result as what would have happened to the patient requires an additional causal argument.", null]
  - [E117, Identifiability criterion, limitsClaim, Simulation-based policy evaluation, D, high, "Dynamics can agree on every observed action yet disagree on actions absent from the records. A simulator chooses among those possibilities through assumptions; agreement with retrospective trajectories alone does not identify the value of an unsupported policy.", null]
  - [E118, Simulation-based policy evaluation, doesNotEstablish, Clinical utility, D, high, "A favourable simulated return is conditional on the state, action, reward and transition model. It is not an observed improvement in patient outcomes, and a reward can omit harms that matter clinically.", null]
  - [E119, Constrained optimisation, doesNotEstablish, Clinical validity, D, high, "Even a certified global optimum only solves the stated objective over the stated feasible set; it cannot repair a mismatched clinical target, an invalid reference label or a constraint that encodes the wrong requirement.", null]
  - [E120, Singular value analysis, assessesProperty, Measurement identifiability, M, high, "For the specified linear forward model y = A*x, a nonzero null-space vector v makes x and x+v observationally identical. Full column rank removes that ambiguity in the noiseless model, but does not validate the model itself.", null]
  - [E121, Singular value analysis, assessesProperty, Inverse-problem conditioning, M, high, "Inverting a linear forward model divides each observable singular-direction component by its singular value, so small nonzero values amplify measurement error. Regularisation can suppress that amplification by changing the estimator, without recovering discarded information.", null]
  - [E122, Measurement identifiability, doesNotEstablish, Clinical assessability, D, high, "A unique solution in a noiseless model can remain too sensitive to noise or finite resolution to support a finding in the actual examination. Uniqueness and usable measurement precision are different requirements.", null]
  - [E123, Evaluation metrics, doesNotEstablish, Inverse-problem conditioning, D, high, "Error on a fixed test set does not report how much a reconstructed quantity can change under measurement perturbations; that requires a forward model, perturbation scale and sensitivity assessment.", null]
  - [E124, Sampling theorem, limitsClaim, Measurement identifiability, D, high, "For a signal band-limited to B, ideal noiseless uniform sampling above 2B permits reconstruction. If the admissible signal class instead contains aliases, distinct continuous signals can produce the same samples and the original is not uniquely determined.", null]
  - [E125, Sampling theorem, limitsClaim, Preprocessing & resampling, D, high, "Before decimation, frequencies outside the new representable band must be removed if aliasing is to be excluded for arbitrary inputs. Upsampling after folding has occurred cannot determine which original frequency produced a sampled component.", null]
  - [E126, Data processing inequality, limitsClaim, Representation learning, D, high, "For a fixed encoder whose only patient-specific input is the image, processing cannot increase mutual information with disease relative to that input. It can make existing information easier for a chosen decoder to use; dependence still does not establish causal relevance.", null]
  - [E127, Data processing inequality, limitsClaim, Inverse reconstruction, D, high, "With a fixed reconstruction model and no additional patient measurements, a prior can select or average among compatible images but cannot add patient-specific information absent from the input. A plausible reconstruction is therefore not a new observation.", null]
  - [E128, Inverse reconstruction, doesNotEstablish, Sonographic features, D, high, "A structure present in a reconstructed image may be supplied by the reconstruction prior rather than resolved by the acquired echoes. Its appearance alone does not establish that the corresponding finding was measured in this patient.", null]
  - [E129, Feedback sensitivity identity, limitsClaim, Feedback correction, D, high, "For the scalar negative-feedback loop S = 1/(1+L) and T = L/(1+L), S+T=1 and hence |S|+|T|>=1 wherever defined. Suppressing output-disturbance transmission through S leaves sensor-noise transmission through T near unity; this is not a theorem about arbitrary clinical learning loops.", null]
  - [E130, Control stability analysis, assessesProperty, Stability margin, M, high, "Given an explicit plant, controller, delay model and perturbation family, pole or frequency-domain analysis can locate a stability boundary. The resulting margin belongs to those dynamics, rather than to a classifier's held-out accuracy.", null]
  - [E131, Stability margin, doesNotEstablish, Clinical utility, D, high, "A loop can remain stable while regulating the wrong quantity or pursuing a clinically harmful target. Distance from an instability boundary does not establish benefit from the action being stabilised.", null]
  - [E132, Bias-variance decomposition, limitsClaim, Evaluation metrics, D, high, "Under squared loss with conditionally zero-mean test noise independent of training, expected prediction error decomposes into squared bias, estimator variance and irreducible noise. A single test score does not identify those terms, and the identity does not impose a conserved budget preventing bias and variance from both improving.", null]
  - [E133, Bayes error bound, limitsClaim, Operating point selection, D, high, "With nonzero class priors and overlapping class-conditional distributions on a set of positive probability, the fixed measurements imply positive Bayes classification error. A threshold cannot make both false positives and false negatives vanish; precision and recall nevertheless have no universal conserved sum, and better measurements can change the bound.", null]
  - [E134, Bayesian inference, usesEvidence, Clinical history & examination, M, high, "Clinical context supplies information for the prior and likelihood appropriate to the target patient population. Information already included in the prior must not be counted again as independent new evidence in the diagnostic update.", null]
  - [E135, Bayesian inference, doesNotEstablish, Calibration, D, high, "A posterior is conditional on its probability model and prior; those choices can be wrong for the deployment population. Calling an output Bayesian does not replace checking agreement between its probabilities and observed outcomes.", null]
  - [E136, Diagnostic reasoning, assessesProperty, Pretest probability, M, high, "The probability before an index test depends on presentation, history and the referral pathway. Prevalence among patients selected for surgery is not automatically the relevant starting probability for a consecutive outpatient examination.", null]
  - [E137, Pretest probability, limitsClaim, Predictive values, D, high, "Bayes' rule gives PPV = Se*pi/(Se*pi + (1-Sp)*(1-pi)) for sensitivity Se, specificity Sp and prevalence pi. Transferring a positive predictive value therefore requires the target prevalence and justification that the conditional test characteristics also transfer.", null]
  - [E138, Bayesian decision analysis, usesEvidence, Clinical history & examination, M, high, "History and examination help specify candidate actions, contraindications and their consequences. A disease posterior becomes an action recommendation only after the clinically relevant consequences are assigned losses.", null]
  - [E139, Bayesian decision analysis, assessesProperty, Clinical utility, M, high, "Expected losses can compare actions under an explicit probability model and clinically justified consequences. This assesses potential value under assumptions; it does not demonstrate that deploying the recommendation improves care.", null]
  - [E140, Gallbladder disease, setsRequirementsFor, Intended use specification, D, high, "Detecting a stone, diagnosing acute inflammation and characterising possible malignancy are different questions. Each requires its own target, unit of analysis, available inputs and intended clinical action before a performance claim has a determinate meaning.", null]
  - [E141, Malignancy & staging, setsRequirementsFor, Reference standard adjudication, D, high, "A specimen-level cancer diagnosis must be matched to the imaged lesion and relevant examination time. Patient-level staging cannot simply become a positive label for every image frame.", null]
  - [E142, Cardiovascular risk, setsRequirementsFor, Reference standard adjudication, D, high, "A prognostic label needs a baseline, prediction horizon and outcome definition, with explicit treatment of censoring and competing events. Outcomes observed under treatment do not directly label the patient's untreated risk.", null]
  - [E143, Acute stroke triage, setsRequirementsFor, Evaluation metrics, D, high, "A triage claim must account for which urgent cases are missed, which alerts consume attention and when a result changes action. Ranking accuracy or isolated inference time does not measure the full clinical delay.", null]
  - [E144, Neurological disease, setsRequirementsFor, Clinical feature annotation, M, high, "A visible movement, an electrical discharge and a longitudinal neurological diagnosis are different annotation targets. The protocol must state the observation interval and relevant clinical state rather than treating an unrecorded phenomenon as absent.", null]
  - [E145, Reference standard adjudication, usesEvidence, Histopathology, M, high, "Tissue findings can anchor a diagnostic label only through an explicit correspondence between specimen, lesion, patient and examination time. The same tissue diagnosis does not make its defining morphology visible in every associated image.", null]
  - [E146, Reference standard adjudication, usesEvidence, Longitudinal follow-up, M, high, "Follow-up can adjudicate later events or disease evolution, but loss of observation before the target horizon is not an automatic negative label. The reference must distinguish censoring, competing events and genuinely observed event-free follow-up.", null]
  - [E147, Reference standard adjudication, usesEvidence, Clinical history & examination, M, high, "Index-time symptoms and examination findings can form part of a clinical target definition. An image-only surrogate cannot silently replace them when the diagnosis depends on clinical context.", null]
  - [E148, Reference standard adjudication, assessesProperty, Clinical validity, M, high, "Checking how labels were established tests whether model outputs are being compared with the intended clinical condition. It includes lesion and time correspondence and whether the reference incorporated the index test, rather than assuming a label name guarantees validity.", null]
  - [E149, Clinical feature annotation, usesEvidence, Sonographic features, M, high, "Independent annotation records which features are present, absent, uncertain or unassessable in the available examination. Blinding to model output and, where appropriate, the final diagnosis helps avoid writing the prediction back into its supposed evidence.", null]
  - [E150, Clinical feature annotation, assessesProperty, Clinical assessability, M, high, "Calling a finding absent requires enough coverage, resolution and appropriate views to assess it. Some findings require a sequence or manoeuvre, so an apparently negative still frame may instead be unassessable.", null]
  - [E151, Clinical feature annotation, assessesProperty, Clinical evidence reliance, M, high, "Independent feature labels permit comparisons between model behaviour and the clinical evidence available in each case. Correlation or decodability alone remains insufficient; the assessment needs a design that distinguishes feature availability from actual diagnostic use.", null]
  - [E152, Intervention & ablation, assessesProperty, Clinical evidence reliance, M, high, "A controlled edit can test whether output responds to a nominated clinical finding while preserving competing evidence. The conclusion is conditional on the edit changing that finding without introducing other diagnostic or acquisition changes.", null]
  - [E153, Faithfulness, doesNotEstablish, Clinical evidence reliance, D, high, "An explanation can accurately report that the model used a site marker or another shortcut. Correctly describing the computation does not make its evidence clinically appropriate.", null]
  - [E154, Clinical validity, doesNotEstablish, Clinical utility, D, high, "An output can correspond accurately to the intended clinical condition without improving decisions or patient outcomes. Clinical benefit additionally depends on what users do with it and on the consequences compared with usual care.", null]
  - [E155, Hypothesis testing, doesNotEstablish, Clinical validity, D, high, "Rejecting a statistical null under the sampling model cannot repair a wrong target, a biased reference process or an incorrect unit of analysis. Statistical significance does not turn those observations into evidence for the intended clinical claim.", null]
  - [E156, Comparative workflow evaluation, assessesProperty, Clinical utility, M, high, "Comparing care with and without the intended use of the system can assess effects on decisions, outcomes, harms and workload. A causal interpretation requires a design addressing alternative explanations for differences between the care pathways.", null]
  - [E157, Clinical history & examination, providesEvidenceFor, Cardiovascular risk, M, high, "Baseline history and current treatment help define the patient and care setting for a risk estimate. Without their timing, observed risk can be confused with the risk before treatment or with treatment benefit.", null]
  - [E158, Longitudinal follow-up, providesEvidenceFor, Cardiovascular risk, M, high, "Risk over a specified horizon concerns future events, so later observations supply evidence that a baseline cross-section cannot provide. Censoring and competing events determine which conclusions those observations support.", null]
  - [E159, Histopathology, canIntroduce, Selection & verification bias, M, high, "When histological verification is available mainly after surgery, restricting evaluation to verified cases conditions on the clinical decision to operate. The resulting case spectrum may differ from that of patients facing the original diagnostic decision.", null]
  - [E160, Selection & verification bias, warrantsReassessmentOf, Pretest probability, D, high, "Prevalence among verified or referred cases need not equal prevalence among consecutive intended-use patients. The selection mechanism must be examined before using that frequency as a clinical prior.", null]
  - [E161, Selection & verification bias, warrantsReassessmentOf, Clinical validity, D, high, "Accuracy conditional on receiving a reference examination is not automatically accuracy in the target population. Differential verification or missing outcomes can change which errors are observable.", null]
  - [E162, Internal validation, assessesProperty, Calibration, M, high, "Predictions on held-out patients can be compared with observed frequencies within the sampled setting, accounting for repeated observations per patient. The assessment remains conditional on that population, label process and prediction horizon.", null]
  - [E163, Internal validation, doesNotEstablish, Transportability, D, high, "An independent split can still share acquisition, referral, treatment and labelling mechanisms with development. Independence of held-out patients does not test whether the model's behaviour persists when those mechanisms change.", null]
  - [E164, External validation, assessesProperty, Transportability, M, high, "Evaluating a frozen model and preprocessing pipeline in another specified setting tests performance under that setting's acquisition, case mix and reference process. This directly supports a claim about the evaluated conditions; broader transport requires an additional argument.", null]
  - [E165, External validation, doesNotEstablish, Clinical evidence reliance, D, high, "A shortcut can persist across institutions, so successful external prediction does not identify which evidence the model used. Testing transport and testing clinical reliance answer different questions.", null]
  - [E166, External validation, doesNotEstablish, Clinical utility, D, high, "Retrospective performance on another site's cases does not show how clinicians act on the output or whether outcomes improve. Those consequences require assessment of the intended use within care.", null]
  - [E167, Distribution shift, warrantsReassessmentOf, Pretest probability, D, high, "A change in referral or recruitment may alter baseline disease odds. Retaining the development prior requires evidence about the new clinical population, rather than an assumption that all shifts leave prevalence unchanged.", null]
  - [E168, Sensitivity analysis, assessesProperty, Transportability, M, high, "Varying specified acquisition conditions, case mix or prevalence can expose which assumptions a transport claim depends on. Such checks support only the perturbations actually represented; they are not a substitute for evidence from every proposed setting.", null]
  - [E169, Clinical validity, doesNotEstablish, Clinical evidence reliance, D, high, "Agreement with a valid clinical target can coexist with reliance on a correlated care-process cue. A correct diagnosis and a correct account of which clinical evidence produced it are separate claims.", null]
  - [E170, Biliary obstruction, canManifestAs, Duct dilatation, E, high, "Impaired bile outflow can produce upstream duct enlargement, but its visibility depends on timing and context. Dilatation can persist after obstruction is relieved, and a nondilated duct does not universally exclude obstruction.", null]
  - [E171, Inflammatory change, canManifestAs, Wall thickening, E, high, "Inflammation can produce gallbladder wall oedema and thickening. The morphology is not specific to inflammation, so the same measurement needs clinical context and competing explanations.", null]
  - [E172, Neoplastic invasion, canManifestAs, Wall thickening, E, high, "An infiltrating gallbladder malignancy can present as wall thickening rather than a discrete mass. Because benign processes can produce the same broad finding, detecting thickness alone does not identify malignant invasion.", null]
  - [E173, Benign wall remodelling, canManifestAs, Intramural cystic spaces, E, high, "In gallbladder adenomyomatosis, wall remodelling can include intramural sinus spaces that appear cystic when resolved. This provides a benign structural explanation to consider rather than treating every thickened wall as malignancy.", null]
  - [E174, Acoustic propagation, canManifestAs, Posterior acoustic effects, E, high, "Reflection, reverberation and attenuation along the beam path can produce posterior shadows or comet-tail echoes. Such appearances arise from tissue interacting with acquisition and can carry diagnostic information rather than being disposable nuisance texture.", null]
  - [E175, Neuronal network activity, canManifestAs, Electrophysiological features, E, high, "Electrical activity can generate recordable field patterns, but the measured waveform depends on spatial summation, source orientation and recording conditions. Disease need not produce a diagnostic event during the available recording interval.", null]
  - [E176, Duct dilatation, providesEvidenceFor, Biliary tract, E, high, "The location and extent of enlargement can help localise a biliary problem. They do not by themselves identify the cause, establish active obstruction or determine the presence of infection.", null]
  - [E177, Wall thickening, providesEvidenceFor, Gallbladder disease, E, high, "Thickness and its pattern bear on the differential diagnosis, but inflammation, benign remodelling and malignancy can overlap. Treating this broad finding as a cancer label discards the clinical alternatives.", null]
  - [E178, Intramural cystic spaces, providesEvidenceFor, Gallbladder disease, E, high, "Resolved intramural spaces can support a wall-remodelling explanation in the appropriate pattern. Their absence in a limited image is weaker evidence than their confident absence after an adequate examination.", null]
  - [E179, Posterior acoustic effects, providesEvidenceFor, Gallbladder disease, E, high, "A shadow behind a suspected calculus or comet-tail echoes arising in a wall can change the interpretation of a lesion. An audit that removes all tissue outside the lesion outline may remove precisely this evidence.", null]
  - [E180, Electrophysiological features, providesEvidenceFor, Neurological disease, E, high, "Electrical discharges can bear on an epilepsy assessment, but a discharge, a recorded clinical event and a diagnosis of recurrent seizure predisposition are different targets. A normal short recording does not universally exclude the disease.", null]
  - [E181, Ultrasound acquisition, changesObservabilityOf, Duct dilatation, E, high, "Duct calibre must be assessed in an adequately visualised segment and plane. Obscuration or incomplete coverage can make a normal-looking frame uninformative about the rest of the biliary tree.", null]
  - [E182, Ultrasound acquisition, changesObservabilityOf, Intramural cystic spaces, E, high, "Depth, focus, resolution and the chosen plane affect whether small intramural spaces can be resolved. A change in their visibility across images need not indicate a change in the wall's underlying structure.", null]
  - [E183, Ultrasound acquisition, changesObservabilityOf, Posterior acoustic effects, E, high, "Beam angle and compounding can change the appearance of shadows and reverberation. Their stability under an image transformation cannot be assumed merely because the biological lesion is unchanged.", null]
  - [E184, Preprocessing & resampling, changesObservabilityOf, Intramural cystic spaces, M, high, "Reducing spatial resolution can remove a small resolved cavity while preserving the overall thickened-wall outline. Preserving the coarse diagnostic label therefore does not guarantee preservation of the evidence used to justify it.", null]
  - [E185, Clinical assessability, limitsClaim, Clinical evidence reliance, D, high, "When the acquisition cannot resolve a specified finding, agreement with a patient diagnosis cannot establish reliance on that finding in this image. Prediction may instead depend on other measured evidence or on prior information; human difficulty alone is not proof of physical non-observability.", null]
  - [E186, Electrophysiological recording, changesObservabilityOf, Electrophysiological features, E, high, "Electrode placement, montage, filtering and recording duration affect which electrical phenomena can be observed. Failure to capture an intermittent event is a limit of the observation as well as a possible clinical negative.", null]
  - [E187, Clinical feature annotation, usesEvidence, Electrophysiological features, M, high, "Annotation can distinguish a waveform event and its time interval from the patient's broader neurological diagnosis. This prevents a patient-level label from being treated as evidence that every sampled window contains a visible event.", null]
  - [E188, Gallbladder disease, setsRequirementsFor, Intervention & ablation, M, high, "For an audit of stone or wall-lesion evidence, preserving the lesion outline is insufficient if the edit destroys posterior shadowing or intramural detail. Clinical interpretation determines which surrounding signal must remain controlled.", null]
  - [E189, Acute stroke triage, setsRequirementsFor, Comparative workflow evaluation, D, high, "A claim of faster clinically useful triage requires measuring the path from acquisition to review and action, including alert burden and downstream delays. Faster computation alone cannot establish a shorter treatment pathway.", null]
  - [E190, Cardiovascular risk, setsRequirementsFor, Bayesian decision analysis, D, high, "Choosing prevention requires expected benefits and harms of an action, not only the probability of an event under observed care. A risk predictor must not be silently reinterpreted as an estimate of treatment effect.", null]
  - [E191, Deployment feedback loop, warrantsReassessmentOf, Transportability, D, high, "If deployment changes who is tested, treated or labelled, the future data-generating process can depend on the policy itself. Validation under the previous care policy does not by itself cover the resulting feedback regime.", null]
  - [E192, Cross-sectional imaging, providesEvidenceFor, Acute stroke triage, M, high, "Brain, vascular and tissue imaging can answer different urgent questions about haemorrhage, arterial occlusion and tissue state. The acquisition protocol determines which question an image can support; success on one task does not establish suitability for the others.", null]
  - [E193, Clinical history & examination, providesEvidenceFor, Gallbladder disease, M, high, "Symptoms and examination findings help distinguish an incidental structural finding from an acute clinical syndrome. An image showing a stone is not by itself a complete reference for diagnosing inflammation or deciding urgency.", null]

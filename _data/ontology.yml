  - [E68, Evaluation metrics, doesNotEstablish, Plausibility, D, high, "A performance figure quantifies agreement with labels and carries no claim about whether the model's reasoning would be recognised as sensible.", null]
  - [E69, Out-of-distribution detection, probesThreat, Distribution shift, M, high, "A support or density estimate can flag inputs unlike the training set, for the notion of likeness the model was given.", "10.1162/089976601750264965"]
  - [E70, Shortcut learning, warrantsReassessmentOf, Out-of-distribution detection, M, medium, "If a site signature is part of what the detector learned to call normal, it can flag a new scanner while passing novel pathology from the familiar one. This is a failure mode to test for, not a guaranteed behaviour.", null]
  - [E71, Out-of-distribution detection, doesNotEstablish, Robustness, D, high, "Declining to answer on inputs judged unfamiliar is not evidence of correct behaviour on inputs judged familiar.", null]
  - [E72, Similarity & graph construction, canIntroduce, Spurious correlation, M, high, "A kernel or affinity matrix asserts which cases count as comparable; if acquisition rather than biology drives that similarity, downstream structure inherits it.", null]
  - [E73, Subgroup & fairness, canAudit, Similarity & graph construction, M, medium, "Degree normalisation decides how far the densely connected majority sets the geometry, so the graph construction is itself a legitimate target of subgroup analysis.", null]
  - [E74, Hypothesis testing, assessesProperty, Calibration, M, medium, "A goodness-of-fit test compares predicted frequencies against observed ones, subject to the test's own independence assumptions.", null]
  - [E75, Hypothesis testing, doesNotEstablish, Robustness, D, high, "A p-value is conditional on the null being true and supplies no probability that any hypothesis holds, let alone that performance transports.", "10.1080/00031305.2016.1154108"]
  - [E76, Preprocessing & resampling, canIntroduce, Spurious correlation, M, medium, "Resampling without anti-aliasing can stamp a ratio-dependent texture on an image, and the ratio may follow the acquiring scanner. Whether it appears depends on the signal content and the sampling, so it is a mechanism to rule out rather than a universal artefact.", "10.1109/CVPR52688.2022.01112"]
  - [E77, Preprocessing & resampling, changesObservabilityOf, Sonographic features, M, high, "Interpolation and filtering can suppress fine texture that a reader or model would otherwise assess.", null]
  - [E78, Auditing, canAudit, Preprocessing & resampling, M, high, "The pipeline that produced the inputs is itself an inspection target, and one that attribution over image content cannot reach.", null]
  - [E79, Deployment & drift, canIntroduce, Deployment feedback loop, M, high, "A model whose outputs influence the care that generates its next training data appears in its own input distribution.", "arXiv:2002.06673"]
  - [E80, Deployment feedback loop, warrantsReassessmentOf, Calibration, M, high, "Once the data reflect the model's own influence, agreement between predictions and recorded outcomes still establishes calibration under that policy and observation process, but no longer under an untreated or differently acted-upon population.", null]
  - [E81, Deployment feedback loop, canIntroduce, Spurious correlation, M, high, "Under-flagging a subgroup yields fewer confirmed cases in it, which trains the next model to under-flag it further.", "arXiv:1706.09847"]
  - [E82, Sensitivity analysis, probesThreat, Deployment feedback loop, M, medium, "Comparing a prospectively recruited stream against operational data can expose divergence the operational data alone cannot show.", null]
  - [E83, Objective design, canIntroduce, Proxy objective, D, high, "Choosing a differentiable stand-in for a non-differentiable evaluation target is what creates the gap; the gap follows from the choice, not from poor execution.", null]

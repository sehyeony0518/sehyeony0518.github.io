  - [E30, Sonographic features, providesEvidenceFor, Malignancy & staging, E, high, "Scope: malignancy-risk assessment of gallbladder polyps. Morphology and size inform risk, not a pathological stage.", "10.1007/s00330-021-08384-w"]
  - [E31, Histopathology, providesEvidenceFor, Malignancy & staging, E, high, "Appropriately sampled tissue establishes malignant histology and sampled invasion, not necessarily the complete stage.", null]

# Evidence-and-auditing ontology over the concepts already in the corpus graph.
#
# The corpus graph says "this piece of writing discusses this concept". This file
# says something different: what kind of thing each concept is, and what holds
# between them. Every edge is an assertion, so every edge is disputable, and the
# ones resting on published results carry the source.
#
# claim: D definitional/logical | M methodological capability, not a demonstrated
#        result | E empirical, context-dependent
# Absence of an edge means not asserted, not false. `doesNotEstablish` is itself a
# positive assertion of non-entailment.
#
# Designed with GPT (session ontology-0909-1620); every citation checked against
# CrossRef/arXiv before being written here.

types:
  Method: "An analytical technique, learning procedure, or organised clinical or audit workflow."
  Metric: "A family of numerical evaluation measures."
  Property: "A characteristic assessed for a specified model, explanation, or population."
  Threat: "A mechanism or condition that can compromise an evidential inference or its transportability."
  ClinicalTarget: "The clinical question or domain for which evidence is being assessed."
  EvidenceSource: "An acquisition or examination process whose observations can supply evidence."
  Finding: "A family of observations interpretable from an examination or image."
  Standard: "A normative document specifying clinical or reporting requirements."
  ModelFamily: "A family of trained computational systems."
  Mechanism: "A biological or physical process that can generate or transform an observable signal."
  Principle: "A mathematical identity, theorem, or inferential condition whose assumptions delimit a claim."

# One definition of the ring colours, read by both the graph and the study page.
# Ring order for the ontology graph: warm where evidence is gathered, cool where it
# is judged, threats last. Must cover `types` exactly - the builder checks it, and a
# type missing here leaves its nodes without a ring position.
order:
  - Mechanism
  - EvidenceSource
  - Finding
  - ClinicalTarget
  - Standard
  - Principle
  - Method
  - ModelFamily
  - Metric
  - Property
  - Threat


relations:
  assessesProperty:
    domain: [Method, Metric]
    range: [Property]
    gloss: "Provides a procedure or numerical assessment of the property, without establishing it conclusively."
  probesThreat:
    domain: [Method]
    range: [Threat]
    gloss: "Can investigate a hypothesis about the threat; nominating a candidate is not confirming a mechanism."
  canIntroduce:
    domain: [Method, Threat, EvidenceSource]
    range: [Threat]
    gloss: "Can create or enable the object. Neither inevitability nor sufficient causation is implied."
  usesEvidence:
    domain: [Method]
    range: [EvidenceSource, Finding]
    gloss: "Observations from the object enter the subject's assessment or reasoning."
  providesEvidenceFor:
    domain: [EvidenceSource, Finding]
    range: [ClinicalTarget]
    gloss: "Can supply observations bearing on the clinical question, without alone resolving it."
  constrainsProcedure:
    domain: [Standard]
    range: [Method, Metric]
    gloss: "Specifies decision rules or reporting requirements. Compliance is not guaranteed."
  warrantsReassessmentOf:
    domain: [Threat]
    range: [Property, Method]
    gloss: "Gives reason to reassess; does not assert that anything has deteriorated."
  doesNotEstablish:
    domain: [Property, Method, Metric, EvidenceSource, Standard]
    range: [Property, Finding]
    gloss: "The subject alone is insufficient to establish the object. Non-entailment, not incompatibility."
  canAudit:
    domain: [Method]
    range: [Method, ModelFamily, EvidenceSource]
    gloss: "Instances or outputs of the object can be explicit inspection targets of the subject."
  changesObservabilityOf:
    domain: [EvidenceSource, Method]
    range: [Finding]
    gloss: "Can change the visibility or assessability of findings without a change in underlying disease."
  limitsClaim:
    domain: [Principle, Property]
    range: [Method, Metric, Property]
    gloss: "Constrains what can be inferred or jointly guaranteed under the assumptions named in the assertion; does not assert an empirical failure."
  setsRequirementsFor:
    domain: [ClinicalTarget]
    range: [Method, Metric]
    gloss: "The clinical question determines which target, unit, timing, evidence, or consequence the procedure or metric must address."
  canManifestAs:
    domain: [Mechanism]
    range: [Finding]
    gloss: "Can generate the finding under specified biological or measurement conditions; neither necessary presence nor diagnostic specificity is implied."


# Evidence-and-auditing ontology over the concepts already in the corpus graph.
#
# The corpus graph says "this piece of writing discusses this concept". This file
# says something different: what kind of thing each concept is, and what holds
# between them. Every edge is an assertion, so every edge is disputable, and the
# ones resting on published results carry the source.
#
# claim: D definitional/logical | M methodological capability, not a demonstrated
#        result | E empirical, context-dependent
# Absence of an edge means not asserted, not false. `doesNotEstablish` is itself a
# positive assertion of non-entailment.
#
# Designed with GPT (session ontology-0909-1620); every citation checked against
# CrossRef/arXiv before being written here.

types:
  Method: "An analytical technique, learning procedure, or organised clinical or audit workflow."
  Metric: "A family of numerical evaluation measures."
  Property: "A characteristic assessed for a specified model, explanation, or population."
  Threat: "A mechanism or condition that can compromise an evidential inference or its transportability."
  ClinicalTarget: "The clinical question or domain for which evidence is being assessed."
  EvidenceSource: "An acquisition or examination process whose observations can supply evidence."
  Finding: "A family of observations interpretable from an examination or image."
  Standard: "A normative document specifying clinical or reporting requirements."
  ModelFamily: "A family of trained computational systems."

# One definition of the ring colours, read by both the graph and the study page.
colors:
  EvidenceSource: {light: "#967531", dark: "#c0a055"}
  Finding:        {light: "#9a5a22", dark: "#c9884a"}
  ClinicalTarget: {light: "#bb3a2f", dark: "#c64f3b"}
  Standard:       {light: "#b04e81", dark: "#c56796"}
  Method:         {light: "#9a31b9", dark: "#b13dc4"}
  ModelFamily:    {light: "#5b46a8", dark: "#7b6ad6"}
  Metric:         {light: "#3154a5", dark: "#5c73ce"}
  Property:       {light: "#327078", dark: "#41a0bf"}
  Threat:         {light: "#278b40", dark: "#8addaf"}

relations:
  assessesProperty:
    domain: [Method, Metric]
    range: [Property]
    gloss: "Provides a procedure or numerical assessment of the property, without establishing it conclusively."
  probesThreat:
    domain: [Method]
    range: [Threat]
    gloss: "Can investigate a hypothesis about the threat; nominating a candidate is not confirming a mechanism."
  canIntroduce:
    domain: [Method, Threat, EvidenceSource]
    range: [Threat]
    gloss: "Can create or enable the object. Neither inevitability nor sufficient causation is implied."
  usesEvidence:
    domain: [Method]
    range: [EvidenceSource, Finding]
    gloss: "Observations from the object enter the subject's assessment or reasoning."
  providesEvidenceFor:
    domain: [EvidenceSource, Finding]
    range: [ClinicalTarget]
    gloss: "Can supply observations bearing on the clinical question, without alone resolving it."
  constrainsProcedure:
    domain: [Standard]
    range: [Method, Metric]
    gloss: "Specifies decision rules or reporting requirements. Compliance is not guaranteed."
  warrantsReassessmentOf:
    domain: [Threat]
    range: [Property, Method]
    gloss: "Gives reason to reassess; does not assert that anything has deteriorated."
  doesNotEstablish:
    domain: [Property, Method, Metric, EvidenceSource, Standard]
    range: [Property, Finding]
    gloss: "The subject alone is insufficient to establish the object. Non-entailment, not incompatibility."
  canAudit:
    domain: [Method]
    range: [Method, ModelFamily, EvidenceSource]
    gloss: "Instances or outputs of the object can be explicit inspection targets of the subject."
  changesObservabilityOf:
    domain: [EvidenceSource, Method]
    range: [Finding]
    gloss: "Can change the visibility or assessability of findings without a change in underlying disease."

concepts:
  Auditing: Method
  Intervention & ablation: Method
  Shortcut learning: Threat
  Causal inference: Method
  Confounding: Threat
  Spurious correlation: Threat
  Clinical guidelines: Standard
  Screening programs: Method
  Diagnostic reasoning: Method
  Gallbladder disease: ClinicalTarget
  Malignancy & staging: ClinicalTarget
  Liver & hepatobiliary: ClinicalTarget
  Histopathology: EvidenceSource
  Neurological disease: ClinicalTarget
  Biliary tract: ClinicalTarget
  Uncertainty & abstention: Method
  Reporting standards: Standard
  Subgroup & fairness: Method
  Calibration: Property
  Evaluation metrics: Metric
  Distribution shift: Threat
  Ultrasound acquisition: EvidenceSource
  Cross-sectional imaging: EvidenceSource
  Sonographic features: Finding
  Representation learning: Method
  Attribution & saliency: Method
  Faithfulness: Property
  Concept-based methods: Method
  Plausibility: Property
  Counterfactual: Method
  Segmentation & detection: Method
  Deployment & drift: Method
  Foundation models: ModelFamily


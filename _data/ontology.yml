  - [E86, Proxy objective, warrantsReassessmentOf, Auditing, D, high, "When the audit's own measure is itself a stand-in for what is being audited, the audit inherits the gap it was meant to detect.", null]
  - [E87, Proxy objective, warrantsReassessmentOf, Uncertainty & abstention, D, medium, "Confidence calibrated against the training objective expresses certainty about the stand-in, which is not certainty about the clinical target.", null]
  - [E88, Operating point selection, canAudit, Subgroup & fairness, M, high, "One threshold applied across groups of differing prevalence produces different error profiles per group; sweeping it exposes that dependence.", "10.1145/3287560.3287598"]

<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <style>
  /* Widen just this page's content column so a 4-up photo grid has room to breathe */
  .container.mt-5 { max-width: 1400px; }

  .photo-gallery {
    column-count: 2;
    column-gap: 0.7rem;
    margin-top: 0.8rem;
  }
  @media (min-width: 640px) { .photo-gallery { column-count: 3; } }
  @media (min-width: 1000px) { .photo-gallery { column-count: 4; } }
  .photo-gallery figure {
    break-inside: avoid;
    margin: 0 0 0.7rem;
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: rgba(128,128,128,.08);
    cursor: zoom-in;
  }
  .photo-gallery img {
    width: 100%;
    display: block;
    border-radius: 8px;
    transition: transform 0.35s ease;
  }
  .photo-gallery figure:hover img { transform: scale(1.04); }
  .photo-gallery figcaption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 1.2rem 0.7rem 0.5rem;
    font-size: 0.74rem;
    color: #fff;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.6));
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .photo-gallery figure:hover figcaption { opacity: 1; }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; z-index: 3000;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.9); padding: 2.5vh 3vw; cursor: zoom-out;
    opacity: 0; transition: opacity .2s ease;
  }
  .lightbox.open { display: flex; opacity: 1; }
  .lightbox img {
    max-width: 100%; max-height: 88vh; border-radius: 8px;
    box-shadow: 0 10px 50px rgba(0,0,0,.6); object-fit: contain;
  }
  .lightbox .lb-cap {
    position: absolute; left: 0; right: 0; bottom: 2vh; text-align: center;
    color: #fff; font-size: .9rem; opacity: .85; padding: 0 1rem;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  .lightbox .lb-close {
    position: absolute; top: 2vh; right: 3vw; color: #fff; font-size: 2rem;
    line-height: 1; opacity: .8; cursor: pointer; background: none; border: 0;
  }
  .lightbox .lb-close:hover { opacity: 1; }

gic laboratory as a TA"> <figcaption>Supervising the digital logic laboratory as a TA</figcaption> </figure> <figure> <img loading="lazy" src="/assets/img/gallery/g18.jpg" alt="At the Embedded &amp; Software Lab"> <figcaption>At the Embedded &amp; Software Lab</figcaption> </figure> <figure> <img loading="lazy" src="/assets/img/gallery/rg05.jpg" alt="B.S. commencement · Ajou University"> <figcaption>B.S. commencement · Ajou University</figcaption> </figure> <figure> <img loading="lazy" src="/assets/img/gallery/rg04.jpg" alt="Commencement day with lab and classmates"> <figcaption>Commencement day with lab and classmates</figcaption> </figure> </div> <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged image"> <button class="lb-close" id="lb-close" aria-label="Close">×</button> <img id="lb-img" src="" alt=""> <div class="lb-cap" id="lb-cap"></div> </div> <script>
  (function () {
    var lb = document.getElementById('lightbox');
    if (!lb) return;
    var lbImg = document.getElementById('lb-img');
    var lbCap = document.getElementById('lb-cap');
    function open(src, cap) {
      lbImg.setAttribute('src', src);
      lbImg.setAttribute('alt', cap || '');
      lbCap.textContent = cap || '';
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function close() {
      lb.classList.remove('open');
      lbImg.setAttribute('src', '');
      document.body.style.overflow = '';
    }
    document.querySelectorAll('.photo-gallery img').forEach(function (img) {
      img.addEventListener('click', function () {
        open(img.getAttribute('src'), img.getAttribute('alt'));
      });
    });
    lb.addEventListener('click', close);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && lb.classList.contains('open')) close();
    });
  })();
</script> </body> </html>

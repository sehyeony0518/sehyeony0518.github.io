<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <p>신약 끝!!</p> <p>[행28:31, 새번역]</p> <blockquote> <p>그는 아무런 방해도 받지 않고, 아주 담대하게 하나님 나라를 전하고, 주 예수 그리스도에 관한 일들을 가르쳤다.</p> </blockquote> <p>이제 나에게 주어진 것은 사도행전 29장의 이야기를 써 내려가는 것이다. 성령의 인도하심으로 복음이 필요한 영혼을 향해 나아가야 한다. 어디를 가든지, 누구를 만나든지 담대하게 주 예수 그리스도를 가르치고 하나님의 나라를 전해야 할 것이다. 나를 통해 일하실 하나님의 계획이 매일 기대가 된다!</p> </body></html>
